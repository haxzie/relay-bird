name: RelayBird
options:
  bundleIdPrefix: dev.haxzie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

targets:
  RelayBird:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: RelayBird
    info:
      path: RelayBird/Resources/Info.plist
      properties:
        CFBundleName: RelayBird
        CFBundleDisplayName: RelayBird
        # Menu bar only: no Dock icon, no window on launch.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # Without these the generated plist keeps Xcode's 1.0/1 defaults, so every build
        # reported version 1.0 however the release was numbered.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle refuses any download that does not verify against this key, so a tampered
        # or truncated image is never installed.
        SUPublicEDKey: TKe0ZXOk9H/eKKvTUkmHLtNSHLc5Ix1R1u3JlfWCdjA=
        SUFeedURL: https://assets.haxzie.com/relaybird/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # We are sandboxed, so Sparkle cannot write to /Applications itself. This routes the
        # install through Installer.xpc inside the framework, which runs outside our sandbox.
        # Without it an update downloads and verifies fine and then fails to install.
        SUEnableInstallerLauncherService: true
        NSHumanReadableCopyright: ""
        # macOS 15+ gates Bonjour browse AND resolve behind local network permission, and
        # without these two keys it fails silently with no prompt at all.
        NSLocalNetworkUsageDescription: >-
          RelayBird finds your paired phone on this Wi-Fi network so it can mirror your text
          messages. Nothing is sent over the internet.
        NSBonjourServices:
          - _relaybird._tcp
    entitlements:
      path: RelayBird/Resources/RelayBird.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Lets us reach Sparkle's installer and status services by name. Sandboxed apps have
        # no other way to talk to them, and Sparkle's own docs prescribe this exact pair.
        # (Downloader.xpc is deliberately not enabled - we already hold network.client.)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haxzie.relaybird
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: -lsqlite3

  RelayBirdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RelayBirdTests
    dependencies:
      - target: RelayBird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haxzie.relaybird.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RelayBird:
    build:
      targets:
        RelayBird: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RelayBirdTests
    archive:
      config: Release
