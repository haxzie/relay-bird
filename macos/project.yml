name: SmsBridge
options:
  bundleIdPrefix: dev.haxzie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  SmsBridge:
    type: application
    platform: macOS
    sources:
      - path: SmsBridge
    info:
      path: SmsBridge/Resources/Info.plist
      properties:
        CFBundleName: SMS Bridge
        CFBundleDisplayName: SMS Bridge
        # Menu bar only: no Dock icon, no window on launch.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # macOS 15+ gates Bonjour browse AND resolve behind local network permission, and
        # without these two keys it fails silently with no prompt at all.
        NSLocalNetworkUsageDescription: >-
          SMS Bridge finds your paired phone on this Wi-Fi network so it can mirror your text
          messages. Nothing is sent over the internet.
        NSBonjourServices:
          - _smsbridge._tcp
    entitlements:
      path: SmsBridge/Resources/SmsBridge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haxzie.smsbridge
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES

  SmsBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SmsBridgeTests
    dependencies:
      - target: SmsBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haxzie.smsbridge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SmsBridge:
    build:
      targets:
        SmsBridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmsBridgeTests
    archive:
      config: Release
