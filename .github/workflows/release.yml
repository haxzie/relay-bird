name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string
  # Called straight from the Version workflow. A tag pushed with GITHUB_TOKEN does not start
  # a workflow — GitHub suppresses that to avoid recursion — so the push trigger above never
  # fires for an automated release and the two have to be chained explicitly.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag has to agree with the version the artefacts will be stamped with, or a release
      # ends up full of files named after the previous one — which looks exactly like the wrong
      # build was published and cannot be told apart from it afterwards.
      - name: Check the tag matches the version
        id: version
        run: |
          set -euo pipefail
          pnpm sync-versions
          version=$(node -p "require('./android/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; tag="${tag#v}"; fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package version $version. Run the Version Packages PR, then tag that commit."
            exit 1
          fi
          if ! git diff --quiet; then
            echo "::error::sync-versions changed generated files — commit them so the build is reproducible."
            git --no-pager diff --stat
            exit 1
          fi

      # Signed when the keystore secret is present. Without it the release task falls back to
      # the debug key, which is fine for a fork but must never be mistaken for a real release,
      # so the artefact is named accordingly.
      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore in secrets; this APK will carry the debug signature"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > android/release.jks
          chmod 600 android/release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The platform goes in the filename. A bare "RelayBird-1.1.0.zip" sitting next to an
      # .apk reads like source rather than the Mac app, and nobody installs a file they
      # cannot identify.
      - name: Name the APK
        run: |
          set -euo pipefail
          suffix=""
          [ "${{ steps.keystore.outputs.signed }}" = "true" ] || suffix="-unsigned"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/RelayBird-${{ steps.version.outputs.version }}-android$suffix.apk"

      - name: Remove the keystore
        if: always()
        run: rm -f android/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: pnpm sync-versions

      # A throwaway keychain, unlocked for this job only. Importing into the login keychain
      # would be both unavailable on a runner and wrong: the point is that the private key
      # disappears with the machine.
      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE" ]; then
            echo "no certificate in secrets; building ad-hoc signed and skipping notarisation"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a UI prompt, which a runner cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1)
          echo "using: $identity"
          team=$(echo "$identity" | sed -n 's/.*(\([A-Z0-9]*\))".*/\1/p')
          printf 'CODE_SIGN_IDENTITY = Developer ID Application\nDEVELOPMENT_TEAM = %s\n' "$team" \
            > macos/Config/Signing.local.xcconfig
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and export
        working-directory: macos
        run: pnpm run release

      # A disk image, because that is what a Mac app arrives in: open it, drag the app onto
      # the Applications alias, done. A zip leaves the app wherever the browser put it.
      - name: Build the disk image
        id: dmg
        run: |
          set -euo pipefail
          version=$(node -p "require('./macos/package.json').version")
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-unsigned"
          name="RelayBird-$version-macOS$suffix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/$name.dmg" >> "$GITHUB_OUTPUT"

          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R dist/RelayBird.app "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create -volname RelayBird -srcfolder "$staging" \
            -ov -format UDZO "dist/$name.dmg"

      # The image is signed as well as the app inside it. An unsigned image makes Gatekeeper
      # complain about the download itself, whatever the app inside it says.
      - name: Sign the disk image
        if: steps.signing.outputs.signed == 'true'
        run: codesign --sign "Developer ID Application" --timestamp "${{ steps.dmg.outputs.dmg }}"

      - name: Notarise and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::warning::notarisation credentials missing; signed but not notarised, so Gatekeeper will block this on another Mac"
            exit 0
          fi
          key_path="$RUNNER_TEMP/asc.p8"
          printf '%s' "$KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          # Submitting the image covers the app inside it, so one round trip does both, and
          # the ticket staples to the thing the user actually downloads.
          xcrun notarytool submit "$DMG" \
            --key "$key_path" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "$DMG"
          rm -f "$key_path"

          # Checks the ticket is accepted rather than trusting that submit returned success.
          # The open context is the one Gatekeeper uses for a downloaded disk image.
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

      - name: Delete the signing keychain
        if: always()
        run: |
          rm -f macos/Config/Signing.local.xcconfig
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Both apps go in one release because they only work as a pair — the protocol version
      # gates them against each other, so letting someone download a phone build without the
      # matching Mac build is handing them a version-mismatch error.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          notes=$(awk '/^## /{ if (seen) exit; seen=1; next } seen' android/CHANGELOG.md 2>/dev/null || true)
          [ -n "$notes" ] || notes="See the changelogs in android/ and macos/."

          # Spelled out because the two apps only work as a pair: the protocol version gates
          # them against each other, so mixing releases produces a version-mismatch error.
          {
            echo "### Downloads"
            echo
            echo "Install **both** — a phone and a Mac from different releases will not pair."
            echo
            echo "| Platform | File | How |"
            echo "|---|---|---|"
            echo "| macOS | \`*-macOS.dmg\` | Open it, drag RelayBird to Applications |"
            echo "| Android | \`*-android.apk\` | \`adb install -r\`, or open it on the phone |"
            echo
            echo "$notes"
          } > "$RUNNER_TEMP/notes.md"

          gh release create "$tag" \
            --title "RelayBird $tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            artifacts/android-apk/* artifacts/macos-app/*
