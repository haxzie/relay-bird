name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run of the same branch irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    # The Android half needs no macOS tooling, and a Linux runner is both faster and cheaper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # Worth keeping even on a green run: this is the build someone grabs to try a branch on
      # a phone without building it themselves.
      - uses: actions/upload-artifact@v4
        with:
          name: relaybird-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Generates the project from project.yml, so a file added without regenerating locally
      # still gets compiled and tested here rather than being quietly left out.
      - name: Test
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project RelayBird.xcodeproj -scheme RelayBird -configuration Debug test

  protocol:
    name: Protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The handshake vectors are asserted by both test suites, and those suites run on
      # different machines above, so nothing else would notice one side quietly rewriting the
      # contract. The vectors are read out of the document rather than repeated here: a third
      # copy is a third thing to forget, and this check already shipped once with a stale one.
      - name: Vectors in the doc are asserted by both implementations
        run: |
          set -euo pipefail
          kotlin=android/app/src/test/kotlin/dev/haxzie/relaybird/ProofsTest.kt
          swift=macos/RelayBirdTests/ProofsTests.swift

          vectors=$(grep -oE '[0-9a-f]{64}' docs/PROTOCOL.md | sort -u)
          count=$(printf '%s\n' "$vectors" | grep -c . || true)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 handshake vectors in docs/PROTOCOL.md, found $count"
            exit 1
          fi

          for hex in $vectors; do
            for file in "$kotlin" "$swift"; do
              grep -q "$hex" "$file" || {
                echo "::error::$file does not assert the vector $hex from docs/PROTOCOL.md"
                exit 1
              }
            done
          done
          echo "all $count vectors are asserted on both sides"
